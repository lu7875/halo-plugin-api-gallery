apiVersion: v1alpha1
kind: Setting
metadata:
  name: api-gallery-settings
spec:
  forms:
    - group: sources
      label: API 数据源
      formSchema:
        - $formkit: repeater
          name: sources
          label: 数据源列表
          help: "新增一行即新增一个图源，保存后插件会立即拉取，无需重启。"
          value: []
          min: 0
          children:
            - $formkit: text
              name: name
              label: 名称
              help: "展示用，例如「派次元」"
              validation: required
            - $formkit: text
              name: apiUrl
              label: API 地址
              help: "返回图片列表的接口地址，例如 https://t.paiii.cn/api/list"
              validation: required
            - $formkit: select
              name: parser
              label: 响应结构
              value: auto
              options:
                - label: 自动识别（推荐）
                  value: auto
                - label: 顶层是数组
                  value: array
                - label: 对象里的 items 字段
                  value: items
                - label: 单个图片对象（随机图接口）
                  value: random
                - label: 302 跳转到随机图片（无列表接口）
                  value: redirect
                - label: 随机单张 JSON（每次返回不一样的图）
                  value: random-json
            - $formkit: number
              name: sampleCount
              label: 采样次数
              help: "仅后两种随机类型需要：每次同步请求多少次，越多攒到的图越多。默认 30，上限 200。"
              value: 30
              min: 1
            - $formkit: number
              name: maxItems
              label: 最多累积
              help: "仅后两种随机类型需要：该图源最多累积多少张，防止图库无限膨胀。默认 200，上限 5000。"
              value: 200
              min: 1
            - $formkit: text
              name: urlField
              label: 图片地址字段
              help: "留空自动识别 url / imageUrl / src 等；302 跳转类型不用填"
            - $formkit: text
              name: idField
              label: 唯一标识字段
              help: "留空自动识别 id / uid 等"
            - $formkit: text
              name: titleField
              label: 标题字段
              help: "留空自动识别 title / name 等"
            - $formkit: text
              name: tagsField
              label: 标签字段
              help: "留空自动识别 tags"
            - $formkit: switch
              name: enabled
              label: 启用该数据源
              value: true
    - group: basic
      label: 同步设置
      formSchema:
        - $formkit: number
          name: syncIntervalMinutes
          label: 同步周期（分钟）
          help: "定时重新拉取各数据源的素材，默认 60 分钟，最小 5 分钟。保存后立刻按新周期生效，不用重启插件。"
          value: 60
          min: 5
        - $formkit: text
          name: syncTip
          label: 关于「图没变」
          value: "固定列表类图源（如 /api/list）每次返回的内容完全一样，同步多少次都是那批图，这是正常的。想要素材有变化，请用随机类型的图源。"
        - $formkit: switch
          name: pushToPhotos
          label: 同步到「图库管理」插件
          help: "把图片地址写成图库的 Photo 记录，在后台 /console/photos 和主题 /photos 页面显示。只写地址不存文件，不占存储；关闭后可一键撤回。"
          value: true
        - $formkit: text
          name: proxyHost
          label: HTTP 代理地址
          help: "服务器无法直连图源时填写，例如 127.0.0.1。留空则尝试 JVM 系统代理属性，再不行就直连。"
        - $formkit: number
          name: proxyPort
          label: HTTP 代理端口
          help: "配合上面地址使用，例如 7890"
          min: 1
        - $formkit: text
          name: photoGroupName
          label: 图库分组名
          help: "留空则按数据源名自动分组；填写则所有图片归入同一个分组。"
        - $formkit: switch
          name: allowAnonymous
          label: 允许访客查看图库
          help: "Halo 的 /apis 接口默认需要登录。开启后插件会自动给匿名用户只读权限，前台页面才能展示；关闭则只有登录用户可访问。"
          value: true
        - $formkit: text
          name: note
          label: 说明
          value: "图片仅缓存地址等元数据，不下载到本站，不占用存储。"
    - group: stability
      label: 稳定与巡检
      formSchema:
        - $formkit: switch
          name: snapshotEnabled
          label: 开启图库快照持久化
          help: "每次同步后把图片元数据写入工作目录 plugins/api-gallery/snapshot.json。Halo 重启、升级核心或重载插件后先恢复快照，避免图库长时间空白。只存地址等元数据，不下载图片。"
          value: true
        - $formkit: switch
          name: deadLinkCheckEnabled
          label: 开启死链巡检
          help: "按周期对第三方图片地址抽样探测（HEAD，必要时降级为 Range GET，不下载完整图片）。"
          value: true
        - $formkit: number
          name: deadLinkCheckIntervalMinutes
          label: 巡检周期（分钟）
          help: "默认 60 分钟，最小 15 分钟。首次巡检在插件启动 10 分钟后执行。"
          value: 60
          min: 15
        - $formkit: number
          name: deadLinkSampleSize
          label: 每个数据源抽样张数
          help: "每轮从每个数据源随机抽取多少张探测，默认 20。随机抽样可长期覆盖全部图片，也避免对图源造成压力。"
          value: 20
          min: 1
        - $formkit: number
          name: deadLinkMaxFailures
          label: 连续几次失效后剔除
          help: "只有返回 404/410/403 才计为失效；超时、5xx、限流不计，防止误删。默认连续 3 次才剔除。"
          value: 3
          min: 1
        - $formkit: switch
          name: deadLinkAutoRemove
          label: 自动剔除失效图片
          help: "关闭后只统计不清理，可在管理接口 /stability 查看疑似死链数。被剔除的图片若图源恢复，后续同步会重新拉回。"
          value: true
        - $formkit: text
          name: alertWebhookUrl
          label: 失败告警 Webhook
          help: "数据源连续同步失败时 POST JSON 到该地址（含 title/text/time 字段），可接企业微信、钉钉、Server 酱或自建服务。必须是公网 http/https 地址，留空则不告警。"
        - $formkit: number
          name: alertAfterFailures
          label: 连续失败几次后告警
          value: 3
          min: 1
        - $formkit: number
          name: alertIntervalHours
          label: 同一数据源告警间隔（小时）
          help: "防止图源长期故障时反复刷屏，默认 6 小时内同一数据源只告警一次。"
          value: 6
          min: 1
    - group: display
      label: 前台展示
      formSchema:
        - $formkit: text
          name: pageTitle
          label: 展示页标题
          help: "同时用于浏览器标题与页面 H1。"
          value: "图库"
        - $formkit: text
          name: pageSubtitle
          label: 副标题 / SEO 描述
          value: "图片由第三方图源提供，不占用本站存储"
        - $formkit: text
          name: pageFooter
          label: 页脚附加文字
          help: "可填写素材来源说明或版权声明，留空则不显示。"
        - $formkit: number
          name: pageSize
          label: 每页加载张数
          value: 48
          min: 1
        - $formkit: switch
          name: showSource
          label: 显示数据来源
          value: true
        - $formkit: switch
          name: showTags
          label: 显示标签与标签筛选
          value: true
        - $formkit: switch
          name: enableDownload
          label: 允许打开原图
          help: "关闭后灯箱里不显示「打开原图」按钮。跨域图片由浏览器自行另存为。"
          value: true
    - group: about
      label: 关于
      formSchema:
        - $formkit: text
          name: authorBlog
          label: 作者主页
          value: "https://github.com/lu7875"
          help: "使用问题、功能建议请到 GitHub 仓库提交 Issue；插件源码与更新日志见主页仓库。"
        - $formkit: text
          name: authorName
          label: 作者
          value: "kbmp"
          help: "本插件由 kbmp 开发并维护，遵循 MIT 协议开源。"
